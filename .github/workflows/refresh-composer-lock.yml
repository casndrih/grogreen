name: Refresh vulnerable Composer lockfile
on:
  push:
    branches: [maintenance/modernization]
    paths:
      - '.github/workflows/refresh-composer-lock.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/modernization
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none
      - name: Update locked dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Update vulnerable Composer dependencies"
            git push origin HEAD:maintenance/modernization
          fi
      - name: Verify dependency advisories
        run: composer audit
